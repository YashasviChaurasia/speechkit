<!doctype html><html><head><meta charset="utf-8"><title>SpeechLens</title><link rel="stylesheet" href="/styles.css"></head><body><main><h1>SpeechLens</h1><p>Upload a conversation, search what was said, and jump to the moment.</p><form id="upload"><input type="file" name="file" required><input type="number" name="num_speakers" min="1" max="20" placeholder="Speakers (optional)"><button>Transcribe</button></form><p id="status"></p><section id="result" hidden><audio id="media" controls></audio><button id="export">Export speechkit.v1 JSON</button><h2>Speakers</h2><div id="speakers"></div><h2>Search</h2><input id="query" placeholder="AWS deployment"><button id="search">Search</button><div id="results"></div><h2>Transcript</h2><div id="segments"></div></section></main><script src="/app.js"></script></body></html>
