[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speechlens"
version = "0.1.0"
description = "Standalone speaker-aware conversation search demo"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sarvamai==0.1.28",
  "keyring==25.7.0",
  "python-multipart>=0.0.9,<1",
  "rapidfuzz==3.14.5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["integration: calls the real Sarvam API"]

[tool.setuptools.package-data]
speechkit = ["fixtures/*.json"]
